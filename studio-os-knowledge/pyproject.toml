[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytnotes"
version = "0.1.0"
description = "Watch YouTube channels, transcribe new videos, and distill them into Obsidian knowledge notes for a Studio OS agent/skill library."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "youtube-transcript-api>=1.0",
    "feedparser>=6.0.11",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "pydantic>=2.6",
    "python-slugify>=8.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
whisper = [
    "yt-dlp>=2024.8.6",
    "faster-whisper>=1.0.3",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ytnotes = "ytnotes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ytnotes = ["py.typed"]
