name: Poll YouTube channels

on:
  schedule:
    # Every 6 hours (UTC). Adjust to taste; cron minimum is 5 minutes.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

# Prevent overlapping runs from racing the state file / commit.
concurrency:
  group: ytnotes-poll
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit generated notes + state back

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional caps (defaults are sensible; override here if needed):
          # YTNOTES_MODEL: claude-sonnet-5
          # YTNOTES_MAX_VIDEOS_PER_RUN: "25"
          # YTNOTES_MAX_WHISPER_PER_RUN: "3"
        run: ytnotes run

      - name: Commit new notes and state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vault state config/channels.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: ingest new YouTube knowledge notes [skip ci]"
            git push
          fi
